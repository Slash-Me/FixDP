// Добавляет модуль-починку на все стыковочные порты (стоковые и из модов).
// Для уже существующих аппаратов модуль при необходимости добавляется плагином на лету.
// Кроме кнопки в меню детали есть окно со списком пар портов: Правый Ctrl + U.
//
// Параметры модуля (раскомментируйте, чтобы изменить):
//   onlyWhenDesynced = true    кнопка только при рассинхроне состояний портов (по умолчанию — у любой стыкованной пары)
//   separationSpeed = 0.3      скорость разлёта после расстыковки, м/с
//   reEngageDistance = 3       на сколько метров аппараты должны разойтись, чтобы порты снова могли стыковаться
//   debugStatus = false        скрыть строку диагностики «Починка порта» в меню детали
@PART[*]:HAS[@MODULE[ModuleDockingNode],!MODULE[ModuleDockingPortRepair]]:FOR[DockingPortRepair]
{
    MODULE
    {
        name = ModuleDockingPortRepair
        // onlyWhenDesynced = true
        // separationSpeed = 0.3
        // reEngageDistance = 3
        // debugStatus = false
    }
}
